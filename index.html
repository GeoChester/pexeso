<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one dark stage. A black cover lies over the whole page and a lantern circle follows the pointer.
   The 4x4 board sits in the middle; the controls stay readable above the cover. A single deliberate dark look. */
:root{
  --void:#000; --night:#0b0612; --edge:#3d2656; --violet:#7a52a8;
  --bone:#efe9d8; --dim:#9283ab; --pumpkin:#ff7a1a; --slime:#62f06a;
  --display:'IM Fell English SC',Georgia,'Times New Roman',serif;
  --text:'IM Fell English',Georgia,'Times New Roman',serif;
  --mono:'Share Tech Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --t:clamp(54px,min(19vw,15.5vh),116px);
  --g:clamp(8px,1.8vw,14px);
  color-scheme:dark;
}
html{height:100%;background:var(--night)}
body{
  min-height:100%;margin:0;padding-inline:16px;padding-block:18px 14px;
  display:flex;flex-direction:column;gap:12px;
  background:var(--night) radial-gradient(ellipse at 50% 30%,#1c0f2b 0%,var(--night) 65%);
  color:var(--bone);font-family:var(--text);
}
html.playing,html.playing body{touch-action:none;overflow:hidden}

.head{text-align:center;display:grid;gap:.25rem;justify-items:center}
h1{margin:0;font:400 clamp(2rem,6vw,3.2rem)/1.05 var(--display);letter-spacing:.07em;text-wrap:balance;text-shadow:0 0 22px rgba(255,122,26,.35)}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.board{display:grid;grid-template-columns:repeat(4,var(--t));gap:var(--g);justify-content:center}

.tile{
  appearance:none;border:0;background:none;padding:0;margin:0;
  width:var(--t);height:var(--t);perspective:700px;cursor:pointer;border-radius:12px;
  -webkit-tap-highlight-color:transparent;
}
.tile:focus-visible{outline:2px solid var(--pumpkin);outline-offset:3px}
.card{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.25,.8,.25,1)}
.face{
  position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--edge);
}
.back{background:radial-gradient(circle at 50% 35%,#2a1740,#170d24 70%)}
.back svg{width:62%;height:62%}
.front{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#241435,#120a1b 75%)}
.front svg{width:74%;height:74%}
.tile.up .card,.tile.done .card{transform:rotateY(180deg)}
.tile:not(.up):not(.done):hover .back{border-color:var(--violet)}
.tile.done .front{border-color:rgba(98,240,106,.7);box-shadow:0 0 16px rgba(98,240,106,.28),inset 0 0 14px rgba(98,240,106,.12)}

.cover{
  position:fixed;inset:0;z-index:10;pointer-events:none;
  --lx:50vw;--ly:40vh;--lr:160px;
  background:
    radial-gradient(circle var(--lr) at var(--lx) var(--ly),rgba(255,140,40,.11) 0%,rgba(255,140,40,0) 70%),
    radial-gradient(circle var(--lr) at var(--lx) var(--ly),rgba(0,0,0,0) 38%,rgba(0,0,0,.62) 72%,#000 100%);
}

.reveal{display:grid;justify-items:center;gap:.3rem;margin-top:clamp(1rem,3vh,1.8rem);text-align:center}
.reveal.on{animation:rise .9s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{margin:0;font:.8rem/1.2 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.coord{margin:0;font:clamp(1.7rem,7.4vw,3.1rem)/1.15 var(--mono);letter-spacing:.04em;overflow-wrap:anywhere}
.coord-n{color:#8dff88;text-shadow:0 0 6px #62f06a,0 0 18px rgba(98,240,106,.75),0 0 40px rgba(98,240,106,.4)}
.coord-w{color:#ffab55;text-shadow:0 0 6px #ff7a1a,0 0 18px rgba(255,122,26,.75),0 0 40px rgba(255,122,26,.4)}
.reveal.on .coord{animation:flick 1.3s linear both,glow 3.4s 1.3s ease-in-out infinite}
.reveal.on .coord-w{animation-delay:.25s,1.9s}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.15}18%{opacity:1}30%{opacity:.4}36%{opacity:1}100%{opacity:1}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

.hud{position:relative;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1rem;font-family:var(--mono);font-size:.85rem;color:var(--dim)}
.stat{margin:0;min-width:0;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{font:inherit;color:var(--dim);background:transparent;border:1px solid var(--edge);border-radius:6px;padding:.5rem .8rem;cursor:pointer}
.btn:hover{color:var(--bone);border-color:var(--pumpkin)}
.btn:focus-visible{outline:2px solid var(--pumpkin);outline-offset:2px}
.btn[aria-pressed="true"]{color:var(--pumpkin);border-color:var(--pumpkin)}
.hint{flex-basis:100%;margin:0;font-family:var(--text);font-style:italic;font-size:1rem;color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .card{transition-duration:.01s}
  .reveal.on,.reveal.on .coord{animation:none}
}
</style>

<header class="head">
  <h1>Midnight Pairs</h1>
</header>

<main class="stage">
  <div class="board" id="board" role="group" aria-label="Memory board, 16 tiles in a 4 by 4 grid"></div>
  <section class="reveal" id="reveal" hidden aria-live="polite">
    <p class="kicker">The dark lifts. Final coordinates</p>
    <p class="coord coord-n" id="cN"></p>
    <p class="coord coord-w" id="cW"></p>
  </section>
</main>

  <p class="stat" id="stat">Pairs 0 of 8 · Moves 0</p>
  <div class="ctl">
    <button class="btn" id="music" type="button" aria-pressed="false">Spooky music: off</button>

</footer>

<script>
(function(){
'use strict';

//CODEC-START
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function stream(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)&255;};}
function unlock(b64,phrase){const raw=atob(b64);const next=stream(fnv(phrase));const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i)^next();return new TextDecoder().decode(out);}
//CODEC-END

const PAYLOAD='Bjg9JdBFmaOCL0AE/wAz9RpmBRHg7oTdDtY7hxhh';

const MOTIFS=[
  {id:'ghost',name:'Ghost'},{id:'bat',name:'Bat'},{id:'pumpkin',name:"Jack-o'-lantern"},{id:'candy',name:'Candy'},
  {id:'hat',name:'Witch hat'},{id:'spider',name:'Spider'},{id:'skull',name:'Skull'},{id:'cauldron',name:'Cauldron'}
];

const $=s=>document.querySelector(s);
const root=document.documentElement;
const board=$('#board'),cover=$('#cover'),reveal=$('#reveal'),stat=$('#stat'),hint=$('#hint'),live=$('#live');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sound (all synthesized, starts only from the button) ---------- */
const Sound=(function(){
  let ac,master,dry,wet,noiseBuf,timer=null,on=false,nextT=0,step=0,bar=0,nextEvt=0;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const PH_A=[76,72,69,71,72,76,81,80,76,72,71,69];
  const PH_B=[77,76,74,72,71,0,69,0,76,0,75,0];

  function impulse(sec,decay){
    const len=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return b;
  }
  function send(g){g.connect(dry);g.connect(wet);}
  function init(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    dry=ac.createGain();dry.gain.value=.7;dry.connect(master);
    const conv=ac.createConvolver();conv.buffer=impulse(3.2,2.4);
    wet=ac.createGain();wet.gain.value=.55;wet.connect(conv);conv.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
    const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    drone();wind();
  }
  function drone(){
    const g=ac.createGain();g.gain.value=.10;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.Q.value=4;
    [[55,'sawtooth',0],[55,'sawtooth',7],[82.41,'sine',0],[110,'triangle',-5]].forEach(function(p){
      const o=ac.createOscillator();o.type=p[1];o.frequency.value=p[0];o.detune.value=p[2];o.connect(lp);o.start();
    });
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=110;
    lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    lp.connect(g);send(g);
  }
  function wind(){
    const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.8;
    const g=ac.createGain();g.gain.value=.05;
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.11;lg.gain.value=260;
    lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
    s.connect(bp);bp.connect(g);send(g);s.start();
  }
  function note(m,t,len){
    const f=hz(m);
    [[1,.20],[2,.06],[2.76,.025],[4.1,.012]].forEach(function(p){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f*p[0];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+len/Math.pow(p[0],.3));
      o.connect(g);send(g);o.start(t);o.stop(t+len+.1);
    });
  }
  function bell(t){
    [[110,.18,7],[263,.07,5],[407,.035,4]].forEach(function(p){
      const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+p[2]);
      o.connect(g);send(g);o.start(t);o.stop(t+p[2]+.1);
    });
  }
  function sweep(t){
    const o=ac.createOscillator(),g=ac.createGain(),v=ac.createOscillator(),vg=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(980,t+3.5);
    v.frequency.value=5.5;vg.gain.value=14;v.connect(vg);vg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.6);g.gain.linearRampToValueAtTime(0,t+3.6);
    o.connect(g);send(g);o.start(t);v.start(t);o.stop(t+3.8);v.stop(t+3.8);
  }
  function pump(){
    while(nextT<ac.currentTime+.5){
      const seq=(bar%3===2)?PH_B:PH_A;
      const m=seq[step];
      if(m)note(m-(Math.random()<.18?12:0),nextT,2.2);
      nextT+=.34*(seq===PH_B?1.5:1);
      step++;
      if(step>=seq.length){step=0;bar++;nextT+=.9;}
    }
    if(ac.currentTime>nextEvt){
      const t=ac.currentTime+.05;
      if(Math.random()<.5)sweep(t);else bell(t);
      nextEvt=ac.currentTime+9+Math.random()*10;
    }
  }
  return{
    toggle:function(){
      if(!on){
        if(!ac)init();
        ac.resume();on=true;nextT=ac.currentTime+.3;step=0;bar=0;nextEvt=ac.currentTime+6;
        timer=setInterval(pump,120);
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.setTargetAtTime(.75,ac.currentTime,.8);
      }else{
        on=false;clearInterval(timer);
        master.gain.setTargetAtTime(0,ac.currentTime,.25);
        setTimeout(function(){if(!on&&ac)ac.suspend();},1400);
      }
      return on;
    },
    sfx:function(kind){
      if(!on||!ac)return;
      const t=ac.currentTime+.01;
      if(kind==='flip'){
        const s=ac.createBufferSource();s.buffer=noiseBuf;
        const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=1.2;
        const g=ac.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);
        s.connect(f);f.connect(g);g.connect(dry);s.start(t,Math.random()*2);s.stop(t+.07);
      }else if(kind==='match'){
        note(88,t,1.2);note(93,t+.12,1.6);
      }else if(kind==='win'){
        [69,72,76,81,84].forEach(function(m,i){note(m,t+i*.14,2.4);});
        bell(t);
      }
    }
  };
})();

/* ---------- game state ---------- */
let cards=[],tiles=[],first=null,busy=false,moves=0,found=0,won=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}
function say(s){live.textContent='';setTimeout(function(){live.textContent=s;},40);}
function update(){stat.textContent='Pairs '+found+' of '+MOTIFS.length+' · Moves '+moves;}
function paint(i){
  const c=cards[i],b=tiles[i],shown=c.up||c.done;
  b.classList.toggle('up',c.up);b.classList.toggle('done',c.done);
  b.setAttribute('aria-label',shown?c.name+(c.done?', matched':', face up'):'Face-down tile '+(i+1)+' of 16');
}

function build(){
  board.textContent='';
  const deck=shuffle(MOTIFS.flatMap(function(m){return[m,m];}));
  cards=deck.map(function(m){return{id:m.id,name:m.name,up:false,done:false};});
  tiles=cards.map(function(c,i){
    const b=document.createElement('button');
    b.type='button';b.className='tile';
    b.innerHTML='<span class="card"><span class="face back"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#moon"/></svg></span><span class="face front"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+c.id+'"/></svg></span></span>';
    b.setAttribute('aria-label','Face-down tile '+(i+1)+' of 16');
    b.addEventListener('click',function(){flip(i);});
    b.addEventListener('focus',function(){
      if(b.matches(':focus-visible')){const r=b.getBoundingClientRect();aim(r.left+r.width/2,r.top+r.height/2);}
    });
    board.appendChild(b);
    return b;
  });
}

function flip(i){
  if(busy||won)return;
  const c=cards[i];
  if(c.up||c.done)return;
  c.up=true;paint(i);Sound.sfx('flip');hint.hidden=true;
  if(first===null){first=i;return;}
  const a=first;first=null;moves++;busy=true;update();
  if(cards[a].id===c.id){
    setTimeout(function(){
      cards[a].done=true;c.done=true;paint(a);paint(i);
      found++;update();Sound.sfx('match');say(c.name+' pair found.');
      busy=false;
      if(found===MOTIFS.length)win();
    },420);
  }else{
    setTimeout(function(){
      cards[a].up=false;c.up=false;paint(a);paint(i);busy=false;
    },950);
  }
}

/* ---------- lantern ---------- */
let tx=0,ty=0,lx=0,ly=0,base=150,dip=0,lifting=null,running=false,moved=false;
function aim(x,y){tx=x;ty=y;}
addEventListener('pointermove',function(e){moved=true;aim(e.clientX,e.clientY);},{passive:true});
addEventListener('pointerdown',function(e){moved=true;aim(e.clientX,e.clientY);},{passive:true});

function measure(){
  const r0=tiles[0].getBoundingClientRect(),r1=tiles[1].getBoundingClientRect();
  base=Math.max(r1.left-r0.left,r0.width)*1.45;
}
function centerOnBoard(snap){
  const r=board.getBoundingClientRect();
  aim(r.left+r.width/2,r.top+r.height/2);
  if(snap){lx=tx;ly=ty;}
}
function frame(now){
  const k=reduce?1:.3;
  lx+=(tx-lx)*k;ly+=(ty-ly)*k;
  let r=base;
  if(!reduce){
    r*=1+.02*Math.sin(now/90)+.012*Math.sin(now/37+2);
    if(Math.random()<.004)dip=.18;
    dip*=.9;r*=1-dip;
  }
  let keep=true;
  if(lifting){
    const p=Math.min(1,(now-lifting.t0)/lifting.dur),e=p*p*(3-2*p);
    r=lifting.from+(lifting.to-lifting.from)*e;
    cover.style.opacity=p>.85?String(1-(p-.85)/.15):'1';
    if(p>=1){lifting=null;cover.hidden=true;keep=false;}
  }
  cover.style.setProperty('--lx',lx+'px');
  cover.style.setProperty('--ly',ly+'px');
  cover.style.setProperty('--lr',Math.max(r,1)+'px');
  if(keep)requestAnimationFrame(frame);else running=false;
}
function startLoop(){if(!running){running=true;requestAnimationFrame(frame);}}

/* ---------- finish ---------- */
function win(){
  won=true;root.classList.remove('playing');
  const phrase=Array.from(new Set(cards.map(function(c){return c.id;}))).sort().join('|');
  let text='';
  try{text=unlock(PAYLOAD,phrase);}catch(e){text='';}
  const parts=text.split('\n');
  $('#cN').textContent=parts[0]||'';
  $('#cW').textContent=parts[1]||'';
  Sound.sfx('win');
  centerOnBoard(false);
  lifting={t0:performance.now(),dur:reduce?300:2400,from:base,to:Math.hypot(innerWidth,innerHeight)*2.8};
  startLoop();
  setTimeout(function(){
    reveal.hidden=false;reveal.classList.add('on');
    say('Máš to správně. Keška je na:');
    reveal.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
  },reduce?400:1800);
}

function reset(){
  won=false;first=null;busy=false;moves=0;found=0;lifting=null;moved=false;
  reveal.hidden=true;reveal.classList.remove('on');
  $('#cN').textContent='';$('#cW').textContent='';
  root.classList.add('playing');
  cover.hidden=false;cover.style.opacity='1';hint.hidden=false;
  scrollTo(0,0);
  build();measure();centerOnBoard(true);update();startLoop();
}

/* ---------- wiring ---------- */
const musicBtn=$('#music');
musicBtn.addEventListener('click',function(){
  const on=Sound.toggle();
  musicBtn.setAttribute('aria-pressed',String(on));
  musicBtn.textContent='Spooky music: '+(on?'on':'off');
});
$('#again').addEventListener('click',reset);
addEventListener('resize',function(){measure();if(!moved&&!won)centerOnBoard(true);});
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(function(){measure();if(!moved&&!won)centerOnBoard(true);});
}

root.classList.add('playing');
build();measure();centerOnBoard(true);update();startLoop();
})();
</script>

</body></html>
